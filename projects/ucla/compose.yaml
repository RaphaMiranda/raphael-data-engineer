name: ucla-demo
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ucla_demo
      POSTGRES_PASSWORD: ${UCLA_LOCAL_ADMIN_PASSWORD:?Set a private local admin password}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ucla-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ucla_demo"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  ucla-postgres:
