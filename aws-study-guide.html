<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="An interactive, topic-by-topic study guide for the AWS Certified Data Engineer – Associate exam." />
  <title>AWS Data Engineer Associate | Study Deck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1326'/%3E%3Cpath d='M14 43 25 19l8 16 6-10 11 18' fill='none' stroke='%235de6ff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='25' cy='19' r='4' fill='%234edea3'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/assets/css/aws-study-guide.css" />
</head>
<body>
  <main class="study-shell">
    <header class="study-header">
      <a class="brand" href="/" aria-label="Return to Raphael Miranda portfolio">Raphael Miranda</a>
      <div class="header-copy">
        <span class="eyebrow">AWS Certified Data Engineer – Associate</span>
        <span class="source-label">Source: personal study notes</span>
        <a class="explorer-link" href="/aws-study-guide/service-explorer.html">Service explorer →</a>
      </div>
    </header>

    <div class="study-workspace" id="study-workspace">
      <section class="study-stage" aria-label="Study slide">
        <div class="ambient-grid" aria-hidden="true"></div>
        <button class="sidebar-toggle" id="overview-toggle" type="button" aria-label="Hide topic list" aria-expanded="true" aria-controls="topic-overview">&gt;</button>
        <div class="slide" id="slide" tabindex="-1" aria-live="polite" aria-atomic="true">
          <p class="loading">Loading the study notes…</p>
        </div>
      </section>
      <aside class="topic-sidebar" id="topic-overview" aria-hidden="false" aria-labelledby="overview-heading">
        <div class="overview-heading">
          <div>
            <p class="eyebrow">Slide summaries</p>
            <h2 id="overview-heading">Study navigation</h2>
          </div>
        </div>
        <div class="topic-list" id="topic-list"></div>
      </aside>
    </div>

    <footer class="study-controls">
      <div class="progress-group">
        <p id="section-name">Preparing guide</p>
        <div class="progress-track" aria-hidden="true"><span id="progress-bar"></span></div>
        <p class="slide-count" id="slide-count">0 / 0</p>
      </div>
      <div class="control-group" aria-label="Slide controls">
        <button class="control-button" id="previous" type="button">Previous</button>
        <button class="control-button primary-control" id="next" type="button">Next</button>
      </div>
      <p class="keyboard-hint"><kbd>←</kbd><kbd>→</kbd> navigate <kbd>O</kbd> topics</p>
    </footer>
  </main>
  <script defer src="https://cdn.jsdelivr.net/npm/gojs@4.0.5/release/go.js"></script>
  <script defer src="/assets/js/aws-study-visuals.js"></script>
  <script defer src="/assets/js/aws-study-guide.js"></script>
</body>
</html>
